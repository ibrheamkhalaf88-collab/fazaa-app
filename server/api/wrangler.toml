# Staff API. Deploy:  cd server/api && npx wrangler deploy
name = "sanad-api"
main = "worker.js"
compatibility_date = "2026-01-01"

# Serve it on the SAME domain as the site so Cloudflare Access can guard /api/v1/staff/*.
# routes = [{ pattern = "sanad.example.com/api/*", zone_name = "example.com" }]

# The dashboard (/admin/) is served by this Worker from ./public (built by scripts/build-admin.mjs),
# so it shares an origin with /api/*. Only /api/* runs the Worker code.
[assets]
directory = "./public"
run_worker_first = ["/api/*"]

[vars]
# The app's origin (public site) and this Worker's own origin (the dashboard).
ALLOWED_ORIGINS = "https://sanad-app.pages.dev,https://sanad-api.ibrheamkhalaf88.workers.dev"
# Cloudflare Zero Trust -> Access -> Applications. Team domain + the Application Audience (AUD) tag.
ACCESS_TEAM_DOMAIN = "restless-voice-f31b.cloudflareaccess.com"
ACCESS_AUD = "f69e9d9a7e9756a4f5fdfc8b1ee7845521f6f8ae631c0bfa8a2e859413ada72b"
# First developer(s): they can then add lawyers from the dashboard. Comma separated.
DEVELOPER_EMAILS = "ibrheamkhalaf88@gmail.com"
AI_DAILY_LIMIT = "3000"        # max online-AI answers per day (protects the provider quota)
RETENTION_CLOSED_DAYS = "7"
RETENTION_IDLE_DAYS = "30"
RETENTION_USER_DAYS = "180"   # accounts with no login for this long are deleted with their cases

# Secret (never in this file):  openssl rand -base64 32 | npx wrangler secret put MESSAGE_KEY

[[d1_databases]]
binding = "DB"
database_name = "sanad"
database_id = "e3a61665-5eff-4f5a-8049-453dd4efbb8f"

[triggers]
crons = ["17 3 * * *"] # daily purge

# Strongly recommended: per-IP rate limit
# [[unsafe.bindings]]
# name = "RATE_LIMITER"
# type = "ratelimit"
# namespace_id = "1002"
# simple = { limit = 30, period = 60 }
