# Fazaa: the public app (/), the staff dashboard (/admin/) and the API (/api/*) on ONE origin.
# Deploy:  node scripts/build-admin.mjs && cd server/api && npx wrangler deploy
name = "fazaa"
main = "worker.js"
compatibility_date = "2026-01-01"

# A custom domain later:  routes = [{ pattern = "fazaa.example.com", custom_domain = true }]

# ./public is built by scripts/build-admin.mjs (app + dashboard). Only /api/* runs the Worker code.
[assets]
directory = "./public"
run_worker_first = ["/api/*"]

[vars]
# The app's origin (public site) and this Worker's own origin (the dashboard).
ALLOWED_ORIGINS = "https://fazaa.ibrheam-app.workers.dev"
# Staff sign in with email + password (server/api/auth.js). The first developer gets a temporary
# password with:  node scripts/staff-password.mjs --email you@example.com
# DEVELOPER_EMAILS is only a bootstrap for the local dev server; keep it empty here.
DEVELOPER_EMAILS = ""
# Checked by the dashboard's "حالة النظام" page.
PUBLIC_SITE_URL = "https://fazaa.ibrheam-app.workers.dev/"
AI_DAILY_LIMIT = "3000"        # max online-AI answers per day (protects the provider quota)
RETENTION_CLOSED_DAYS = "7"
RETENTION_IDLE_DAYS = "30"
RETENTION_USER_DAYS = "180"   # accounts with no login for this long are deleted with their cases

# Secret (never in this file):  openssl rand -base64 32 | npx wrangler secret put MESSAGE_KEY

[[d1_databases]]
binding = "DB"
database_name = "fazaa"
database_id = "cce20983-1e00-4e11-8153-2cfb5d93261b"

[triggers]
crons = ["17 3 * * *"] # daily purge

# Per-IP rate limit, applied only to AI / sign-up / sign-in / counters (see RATE_LIMITED in worker.js).
# 30 requests per minute per IP and endpoint. period must be 10 or 60.
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1002"
simple = { limit = 30, period = 60 }
