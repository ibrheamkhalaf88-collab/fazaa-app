<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="color-scheme" content="light dark" />
    <title>فزعة | لوحة التحكم</title>
    <link rel="stylesheet" href="../styles/fonts.css" />
    <link rel="stylesheet" href="admin.css" />
  </head>
  <body>
    <div class="shell" id="shell" hidden>
      <aside class="side">
        <div class="brand">
          فَزعة
          <small>لوحة التحكم</small>
        </div>
        <nav id="nav" class="nav" aria-label="الأقسام"></nav>
        <div class="side-foot">
          <div class="me">
            <b id="me-name"></b>
            <span id="me-mail" class="muted"></span>
            <span id="me-role" class="pill"></span>
          </div>
          <div class="tools">
            <button id="theme" class="ghost" type="button" aria-label="تبديل المظهر"></button>
            <button id="sound" class="ghost" type="button" aria-pressed="false" hidden></button>
          </div>
          <div class="tools">
            <button id="change-pw" class="ghost" type="button">تغيير كلمة السر</button>
            <button id="logout" class="ghost" type="button">تسجيل الخروج</button>
          </div>
        </div>
      </aside>
      <main class="main">
        <div id="banner" class="banner" role="alert" hidden></div>
        <div id="view"></div>
      </main>
    </div>
    <p id="boot" class="boot">جاري التحميل...</p>

    <main class="auth" id="login" hidden>
      <form class="card auth-card" id="login-form" novalidate>
        <div class="brand">فَزعة <small>لوحة التحكم</small></div>
        <h1>تسجيل الدخول</h1>
        <label for="login-email">البريد الإلكتروني</label>
        <input id="login-email" type="email" dir="ltr" autocomplete="username" required />
        <label for="login-password">كلمة السر</label>
        <input id="login-password" type="password" dir="ltr" autocomplete="current-password" required />
        <p id="login-error" class="form-error" role="alert" hidden></p>
        <button class="primary" type="submit">دخول</button>
        <p class="hint">نسيتي كلمة السر؟ اطلبي من المسؤول يعمللك كلمة سر مؤقتة جديدة.</p>
      </form>
    </main>

    <main class="auth" id="pw" hidden>
      <form class="card auth-card" id="pw-form" novalidate>
        <h1>تغيير كلمة السر</h1>
        <p id="pw-why" class="hint"></p>
        <label for="pw-current">كلمة السر الحالية (أو المؤقتة)</label>
        <input id="pw-current" type="password" dir="ltr" autocomplete="current-password" required />
        <label for="pw-next">كلمة السر الجديدة (10 أحرف على الأقل)</label>
        <input id="pw-next" type="password" dir="ltr" autocomplete="new-password" minlength="10" required />
        <label for="pw-again">أعيدي كتابة الجديدة</label>
        <input id="pw-again" type="password" dir="ltr" autocomplete="new-password" required />
        <p id="pw-error" class="form-error" role="alert" hidden></p>
        <button class="primary" type="submit">حفظ</button>
        <button id="pw-cancel" class="ghost" type="button" hidden>رجوع</button>
      </form>
    </main>
    <script type="module" src="admin.js"></script>
  </body>
</html>
